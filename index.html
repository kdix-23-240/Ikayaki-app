<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イカ焼き会計アプリ</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        header, footer { background-color: #f2f2f2; padding: 15px; text-align: center; }
        nav { display: flex; justify-content: space-around; background-color: #333; }
        nav button { background: none; border: none; color: white; padding: 15px; font-size: 16px; cursor: pointer; width: 100%;}
        nav button.active { background-color: #555; }
        main { padding: 15px; }
        .date-selector { text-align: center; padding: 10px; background-color: #e9e9e9; }
        .menu-item, .order-item, .history-item, .price-item, .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #ddd; }
        .order-summary, .data-summary { margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 8px; }
        .full-width-btn { width: 100%; padding: 15px; font-size: 18px; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #confirm-order-btn { background-color: #4CAF50; }
        #confirm-order-btn:disabled { background-color: #a5d6a7; cursor: not-allowed; }
        #add-expense-btn { background-color: #2196F3; margin-bottom: 15px; }
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

    <header class="date-selector">
        <select id="date-select">
            <option value="2025/10/28">0日目 (2025/10/28)</option>
            <option value="2025/11/03">1日目 (2025/11/03)</option>
            <option value="2025/11/04">2日目 (2025/11/04)</option>
            <option value="2025/11/05">3日目 (2025/11/05)</option>
        </select>
    </header>

    <main id="app-content">
        <section id="order-screen" class="screen active">
            <h2>注文</h2>
            <div id="menu-list"><p>メニューを読み込み中...</p></div>
            <div class="order-summary">
                <h3>現在の注文</h3>
                <div id="current-order-list"><p>商品はまだ追加されていません。</p></div>
                <hr>
                <p><strong>合計金額: <span id="total-price">0</span> 円</strong></p>
                <button id="confirm-order-btn" class="full-width-btn">注文を確定する</button>
            </div>
        </section>

        <section id="expense-screen" class="screen">
            <h2>支出</h2>
            <button id="add-expense-btn" class="full-width-btn">支出を追加</button>
            <div id="expense-list"></div>
        </section>

        <section id="data-screen" class="screen">
            <h2>データ</h2>
            <div class="data-summary">
                <h3>売上概要</h3>
                <p><strong>総売上: <span id="summary-total-sales">0</span> 円</strong></p>
                <p><strong>販売総数: <span id="summary-total-items">0</span> 個</strong></p>
            </div>
            <h3>注文履歴</h3>
            <div id="order-history-list">
                <p>履歴を読み込んでいます...</p>
            </div>
        </section>

        <section id="price-screen" class="screen">
            <h2>価格設定</h2>
            <form id="password-gate" onsubmit="return false;">
                <p>この画面を操作するにはパスワードが必要です。</p>
                <input type="password" id="password-input" placeholder="パスワードを入力" style="width: 80%; padding: 10px;">
                <button id="auth-btn" type="submit" style="padding: 10px;">認証</button>
            </form>
            <div id="price-list-container" style="display: none;">
                <p>商品の価格を変更できます。</p>
                <div id="price-list"></div>
            </div>
        </section>
    </main>

    <footer>
        <nav>
            <button class="nav-tab active" data-screen="order-screen">注文</button>
            <button class="nav-tab" data-screen="expense-screen">支出</button>
            <button class="nav-tab" data-screen="data-screen">データ</button>
            <button class="nav-tab" data-screen="price-screen">価格</button>
        </nav>
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxdpT6hVAl5F7jMcwqmuwinR6v9H4hVvfHz7P87LwJOnkaFiqowhKI9zYTK04tImN_J/exec';

        // --- DOM Elements ---
        const dateSelect = document.getElementById('date-select');
        const menuListDiv = document.getElementById('menu-list');
        const currentOrderListDiv = document.getElementById('current-order-list');
        const totalPriceSpan = document.getElementById('total-price');
        const confirmOrderBtn = document.getElementById('confirm-order-btn');
        const navTabs = document.querySelectorAll('.nav-tab');
        const screens = document.querySelectorAll('.screen');
        const summaryTotalSalesSpan = document.getElementById('summary-total-sales');
        const summaryTotalItemsSpan = document.getElementById('summary-total-items');
        const orderHistoryListDiv = document.getElementById('order-history-list');
        const passwordInput = document.getElementById('password-input');
        const authBtn = document.getElementById('auth-btn');
        const passwordGateDiv = document.getElementById('password-gate');
        const priceListContainerDiv = document.getElementById('price-list-container');
        const priceListDiv = document.getElementById('price-list');
        const addExpenseBtn = document.getElementById('add-expense-btn');
        const expenseListDiv = document.getElementById('expense-list');

        // --- App State ---
        let currentOrder = [];
        let fullData = {};
        let isAuthenticated = false;

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', fetchDataForDate);
        dateSelect.addEventListener('change', fetchDataForDate);
        confirmOrderBtn.addEventListener('click', () => {
            if (currentOrder.length > 0) recordSale();
            else alert('商品が追加されていません。');
        });
        navTabs.forEach(tab => {
            tab.addEventListener('click', () => switchScreen(tab.dataset.screen));
        });
        authBtn.addEventListener('click', verifyPassword);
        addExpenseBtn.addEventListener('click', recordExpense);

        // --- Main Functions ---
        function switchScreen(targetScreenId) {
            navTabs.forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-screen="${targetScreenId}"]`).classList.add('active');
            
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(targetScreenId).classList.add('active');

            if (targetScreenId === 'data-screen') renderDataScreen();
            if (targetScreenId === 'price-screen') renderPriceScreen();
            if (targetScreenId === 'expense-screen') renderExpenseScreen();
        }
        
        async function fetchDataForDate() {
            const selectedDate = dateSelect.value;
            document.getElementById('menu-list').innerHTML = '<p>データを読み込み中...</p>';
            currentOrder = [];
            renderCurrentOrder(); 
            isAuthenticated = false;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getDataForDate', payload: { date: selectedDate } })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    fullData = result.data;
                    renderMenu(fullData.menu);
                    
                    const activeScreenId = document.querySelector('.screen.active').id;
                    if(activeScreenId === 'data-screen') renderDataScreen();
                    if(activeScreenId === 'expense-screen') renderExpenseScreen();

                } else { throw new Error(result.message); }
            } catch (error) {
                console.error('データの取得に失敗しました:', error);
                document.getElementById('menu-list').innerHTML = `<p style="color: red;">エラー: データの取得に失敗しました。</p>`;
            }
        }
        
        async function recordSale() {
            confirmOrderBtn.disabled = true;
            confirmOrderBtn.textContent = '送信中...';
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'recordSale', payload: { items: currentOrder } })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert('注文を記録しました！');
                    currentOrder = [];
                    renderCurrentOrder();
                    await fetchDataForDate();
                } else { throw new Error(result.message); }
            } catch (error) {
                console.error('注文の記録に失敗しました:', error);
                alert(`エラー: 注文の記録に失敗しました。\n${error.message}`);
            } finally {
                confirmOrderBtn.disabled = false;
                confirmOrderBtn.textContent = '注文を確定する';
            }
        }
        
        async function recordExpense() {
            const name = prompt("品名を入力してください:");
            if (!name) return;

            const amount = prompt("金額を数字で入力してください:");
            if (!amount || isNaN(amount)) {
                alert("有効な数字を入力してください。");
                return;
            }

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'recordExpense',
                        payload: { date: dateSelect.value, name: name, amount: Number(amount) }
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert('支出を記録しました。');
                    await fetchDataForDate();
                } else { throw new Error(result.message); }
            } catch (error) { alert('支出の記録中にエラーが発生しました。'); }
        }

        async function verifyPassword() {
            const password = passwordInput.value;
            if (!password) { alert('パスワードを入力してください。'); return; }
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verifyPassword', payload: { password: password } })
                });
                const result = await response.json();
                if (result.status === 'success' && result.data.authenticated) {
                    isAuthenticated = true;
                    renderPriceScreen();
                } else { alert('認証に失敗しました。'); }
            } catch (error) { alert('エラーが発生しました。'); }
        }

        async function updatePrice(name, newPrice) {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'updatePrice', payload: { name: name, newPrice: newPrice } })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert('価格を更新しました！');
                    await fetchDataForDate();
                    renderPriceScreen();
                } else { throw new Error(result.message); }
            } catch (error) { alert('価格の更新中にエラーが発生しました。'); }
        }

        // --- Rendering Functions ---
        function renderMenu(menuItems) {
            menuListDiv.innerHTML = '';
            if(!menuItems || menuItems.length === 0) { menuListDiv.innerHTML = '<p>表示できるメニューがありません。</p>'; return; }
            menuItems.forEach(item => {
                const el = document.createElement('div');
                el.className = 'menu-item';
                el.innerHTML = `<span>${item.name} (${item.price}円)</span><button>追加</button>`;
                el.querySelector('button').addEventListener('click', () => addToOrder(item));
                menuListDiv.appendChild(el);
            });
        }

        function addToOrder(itemToAdd) {
            const existingItem = currentOrder.find(item => item.name === itemToAdd.name);
            if (existingItem) existingItem.quantity++;
            else currentOrder.push({ name: itemToAdd.name, price: itemToAdd.price, quantity: 1 });
            renderCurrentOrder();
        }

        function renderCurrentOrder() {
            currentOrderListDiv.innerHTML = '';
            let totalPrice = 0;
            if (currentOrder.length === 0) {
                currentOrderListDiv.innerHTML = '<p>商品はまだ追加されていません。</p>';
            } else {
                currentOrder.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'order-item';
                    el.innerHTML = `<span>${item.name} x ${item.quantity}</span><span>${item.price * item.quantity}円</span>`;
                    currentOrderListDiv.appendChild(el);
                    totalPrice += item.price * item.quantity;
                });
            }
            totalPriceSpan.textContent = totalPrice;
        }

        /**
         * ★★★ 修正ポイント ★★★
         * サーバーから送られてきたサマリーを表示するように変更
         */
        function renderDataScreen() {
            const summary = fullData.summary || { totalSales: 0, totalItems: 0 };
            const salesHistory = fullData.sales || [];
            
            // サーバーで計算済みの値を表示するだけ
            summaryTotalSalesSpan.textContent = summary.totalSales;
            summaryTotalItemsSpan.textContent = summary.totalItems;

            orderHistoryListDiv.innerHTML = '';
            if (salesHistory.length === 0) { orderHistoryListDiv.innerHTML = '<p>この日の売上履歴はまだありません。</p>'; }
            else {
                [...salesHistory].reverse().forEach(item => {
                    const historyElement = document.createElement('div');
                    historyElement.className = 'history-item';
                    const time = new Date(item.timestamp).toLocaleTimeString('ja-JP');
                    historyElement.innerHTML = `<span>[${time}] ${item.name} x ${item.quantity}</span><span>${item.subtotal}円</span>`;
                    orderHistoryListDiv.appendChild(historyElement);
                });
            }
        }
        
        function renderExpenseScreen() {
            expenseListDiv.innerHTML = '';
            const expenses = fullData.expenses || [];
            if (expenses.length === 0) {
                expenseListDiv.innerHTML = '<p>この日の支出はまだありません。</p>';
                return;
            }
            expenses.forEach(item => {
                const expenseEl = document.createElement('div');
                expenseEl.className = 'expense-item';
                expenseEl.innerHTML = `<span>${item.name}</span><span>${item.amount}円</span>`;
                expenseListDiv.appendChild(expenseEl);
            });
        }

        function renderPriceScreen() {
            if (isAuthenticated) {
                passwordGateDiv.style.display = 'none';
                priceListContainerDiv.style.display = 'block';
                
                priceListDiv.innerHTML = '';
                const menuItems = fullData.menu || [];
                menuItems.forEach(item => {
                    const priceItemEl = document.createElement('div');
                    priceItemEl.className = 'price-item';
                    priceItemEl.innerHTML = `<span>${item.name} (現在 ${item.price}円)</span><button>変更</button>`;
                    priceItemEl.querySelector('button').addEventListener('click', () => {
                        const newPrice = prompt(`${item.name}の新しい価格を入力してください（数字のみ）:`, item.price);
                        if (newPrice && !isNaN(newPrice)) {
                            updatePrice(item.name, Number(newPrice));
                        }
                    });
                    priceListDiv.appendChild(priceItemEl);
                });
            } else {
                passwordGateDiv.style.display = 'block';
                priceListContainerDiv.style.display = 'none';
                passwordInput.value = '';
            }
        }
    </script>
</body>
</html>
